<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aegis AI Shield</title>
  <link rel="stylesheet" href="popup.css">
  <!-- Google Fonts import -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header>
      <div class="logo-area">
        <span class="shield-icon">🛡️</span>
        <span class="brand-name">AEGIS <span class="accent">AI</span></span>
      </div>
      <div class="status-indicator">
        <span class="pulse-dot"></span> Active
      </div>
    </header>

    <!-- Main Shield Circle -->
    <main>
      <div class="shield-circle-wrapper">
        <div class="shield-circle">
          <div class="shield-inner">
            <span id="counter" class="count-number">0</span>
            <span class="count-label">ADS BLOCKED</span>
          </div>
        </div>
      </div>

      <!-- Feature Controls -->
      <div class="controls">
        <div class="toggle-card">
          <div class="toggle-info">
            <span class="toggle-title">Dynamic AI Filtering</span>
            <span class="toggle-desc">Predictive layout scan</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="ai-filter" checked>
            <span class="slider"></span>
          </label>
        </div>

        <div class="toggle-card">
          <div class="toggle-info">
            <span class="toggle-title">System DNS Sync</span>
            <span class="toggle-desc">Router proxy tunnel</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="dns-tunnel" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </main>

    <!-- Footer Stats Link -->
    <footer>
      <a href="http://localhost:3000" target="_blank" class="dashboard-btn">
        OPEN CENTRAL DASHBOARD ➔
      </a>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
